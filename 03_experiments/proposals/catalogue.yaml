# Pre-registered candidate catalogue. Written before any experiment ran.
# Observation that motivates the ORDER (baseline, train): all of ranked_too_low (71) and right_doc_wrong_section (59) show the
# top-1 passage is the contract's cover page / preamble (doc hit@1 = 1.00, R@1 = 0.00). The question's "Consider the <title>;"
# clause (party names, 'Agreement') matches that opening text and swamps the clause terms.
# Each entry's `overrides` are deep-merged onto the CURRENT accepted parent. `targets` are failure labels the entry is meant to fix.
# The proposer picks the first untried entry whose targets contain the parent's most frequent failure label, then the next label.
entries:
  - id: strip-title
    targets: [right_doc_wrong_section, ranked_too_low]
    hypothesis: >
      Scoring only the clause question (title clause removed) stops party-name tokens from pulling the cover-page chunk to the top,
      so clause chunks rank higher. Risk: without the title, other contracts compete, so wrong_document may rise.
    overrides: {query: {strip_title_prefix: true}}

  - id: route-filter
    targets: [wrong_document, right_doc_wrong_section, ranked_too_low]
    hypothesis: >
      Use the title only to choose the contract (BM25 over each contract's opening 3000 chars), then rank clause chunks inside that
      contract only. Separates 'which contract' from 'which clause', which the baseline conflates.
    overrides: {query: {strip_title_prefix: true}, routing: {mode: filter, top_docs: 1, head_chars: 3000}}

  - id: route-boost
    targets: [wrong_document, right_doc_wrong_section, ranked_too_low]
    hypothesis: >
      Soft routing (multiply scores of the routed contract's chunks by 3) is more robust than a hard filter when the title match is wrong.
    overrides: {query: {strip_title_prefix: true}, routing: {mode: boost, top_docs: 1, head_chars: 3000, boost: 2.0}}

  - id: stopwords
    targets: [ranked_too_low, partial_span, right_doc_wrong_section]
    hypothesis: Dropping English function words reduces matches on 'this/the/under/any', which appear in every clause.
    overrides: {retrieval: {bm25: {tokenizer: {stopwords: english}}}}

  - id: chunk-300
    targets: [partial_span, ranked_too_low]
    hypothesis: Gold spans have a median near 300 chars; 300-char chunks raise precision and make ranking more selective.
    overrides: {chunking: {size_chars: 300, overlap_chars: 0}}

  - id: chunk-1000
    targets: [partial_span, ranked_too_low]
    hypothesis: Longer chunks cover multi-sentence clauses fully (fewer partial spans), at some cost in precision.
    overrides: {chunking: {size_chars: 1000, overlap_chars: 0}}

  - id: paragraph-chunks
    targets: [partial_span, ranked_too_low, right_doc_wrong_section]
    hypothesis: Chunks that respect paragraph boundaries keep a clause together instead of cutting it mid-sentence at a fixed offset.
    overrides: {chunking: {strategy: paragraph, size_chars: 800}}

  - id: clause-chunks
    targets: [partial_span, ranked_too_low, right_doc_wrong_section]
    hypothesis: Splitting at section headings/numbering aligns chunks with legal clauses, which is how annotators mark answers.
    overrides: {chunking: {strategy: clause, size_chars: 800}}

  - id: overlap-100
    targets: [partial_span]
    hypothesis: 100-char overlap prevents a clause from being split exactly at a window boundary.
    overrides: {chunking: {overlap_chars: 100}}

  - id: stem-light
    targets: [ranked_too_low, right_doc_wrong_section]
    hypothesis: Light stemming matches 'assign/assignment/assigned', 'terminate/termination'.
    overrides: {retrieval: {bm25: {tokenizer: {stem: light}}}}

  - id: bm25-k1-low
    targets: [ranked_too_low, partial_span]
    hypothesis: Lower k1 (1.0) reduces the reward for repeated terms, which favours long boilerplate chunks.
    overrides: {retrieval: {bm25: {k1: 1.0}}}

  - id: bm25-b-high
    targets: [ranked_too_low, partial_span]
    hypothesis: Higher length normalisation (b = 0.9) penalises long chunks that match by sheer length.
    overrides: {retrieval: {bm25: {b: 0.9}}}

  - id: expand-100
    targets: [partial_span]
    hypothesis: Growing each returned passage by 100 chars on both sides captures spans that straddle chunk edges.
    overrides: {ranking: {expand_chars: 100}}

  - id: abstain-norm
    targets: [ranked_too_low, partial_span, right_doc_wrong_section, wrong_document, hit]
    hypothesis: A score normalised by the query's idf mass is comparable across questions of different length, improving separation.
    overrides: {abstention: {signal: top1_norm}}

  - id: abstain-margin
    targets: [ranked_too_low, partial_span, right_doc_wrong_section, wrong_document, hit]
    hypothesis: The margin between the first and second passage is a better confidence signal than the raw top score.
    overrides: {abstention: {signal: margin_norm}}
