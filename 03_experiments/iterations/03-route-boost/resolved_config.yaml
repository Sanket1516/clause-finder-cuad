name: 03-route-boost
description: Soft routing (multiply scores of the routed contract's chunks by 3) is
  more robust than a hard filter when the title match is wrong.
chunking:
  strategy: fixed
  size_chars: 500
  overlap_chars: 0
  min_chars: 20
query:
  strip_title_prefix: true
routing:
  mode: boost
  top_docs: 1
  head_chars: 3000
  boost: 2.0
retrieval:
  method: bm25
  candidates: 100
  bm25:
    k1: 1.5
    b: 0.75
    tokenizer:
      lowercase: true
      stopwords: none
      stem: none
      min_token_len: 1
ranking:
  remove_overlaps: true
  expand_chars: 0
abstention:
  signal: top1_score
  threshold: 15.138010657765532
  target_far: 0.05
evaluation:
  ks:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  primary_k: 4
