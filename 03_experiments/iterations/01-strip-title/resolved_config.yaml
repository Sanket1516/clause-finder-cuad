name: 01-strip-title
description: 'Scoring only the clause question (title clause removed) stops party-name
  tokens from pulling the cover-page chunk to the top, so clause chunks rank higher.
  Risk: without the title, other contracts compete, so wrong_document may rise.'
chunking:
  strategy: fixed
  size_chars: 500
  overlap_chars: 0
  min_chars: 20
query:
  strip_title_prefix: true
routing:
  mode: none
  top_docs: 1
  head_chars: 3000
  boost: 1.0
retrieval:
  method: bm25
  candidates: 100
  bm25:
    k1: 1.5
    b: 0.75
    tokenizer:
      lowercase: true
      stopwords: none
      stem: none
      min_token_len: 1
ranking:
  remove_overlaps: true
  expand_chars: 0
abstention:
  signal: top1_score
  threshold: 10.888021360060938
  target_far: 0.05
evaluation:
  ks:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  primary_k: 4
